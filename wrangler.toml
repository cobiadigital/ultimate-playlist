name = "ultimate-playlist"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Non-secret config. SPOTIFY_REDIRECT_URI must EXACTLY match a Redirect URI registered
# on your Spotify app (including scheme and no trailing slash). This pins the deployed
# (production) callback. If you remove it, the app derives the callback from the incoming
# request origin (`${origin}/auth/callback`) instead — handy for *.workers.dev previews or
# custom domains, but you must still register each host's callback URL in the Spotify app.
[vars]
SPOTIFY_REDIRECT_URI = "https://ultimate-playlist.cobiadigital.workers.dev/auth/callback"

# Secrets (set in the Cloudflare dashboard for git-deployed Workers, or via
# `wrangler secret put <NAME>` for manual deploys; use .dev.vars for `wrangler dev`):
#   SPOTIFY_CLIENT_ID      (or SPOTIFY_CLIENT)
#   SPOTIFY_CLIENT_SECRET  (or SPOTIFY_SECRET)
#   SESSION_SECRET         (long random string; encrypts the session cookie)
